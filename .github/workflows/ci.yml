name: CI - Grocery API

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/grocery-api  # <- run commands inside grocery-api

    steps:
      # Step 1: Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Setup Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      # Step 3: Upgrade pip and install uv
      - name: Install uv
        run: python -m pip install --upgrade pip uv

      # Step 4: Sync dependencies (including dev extras)
      - name: Sync dependencies
        run: uv sync --extras dev

      # Step 5: Run linting
      - name: Lint
        run: |
          echo "Running flake8..."
          uv run flake8 app
          echo "Checking code formatting with black..."
          uv run black --check app
          echo "Checking import order with isort..."
          uv run isort --check-only app
          echo "Running pylint..."
          uv run pylint app

      # Step 6: Run tests with coverage check
      - name: Test with coverage
        run: |
          echo "Running tests with pytest and coverage..."
          uv run pytest --cov=app --cov-fail-under=80 tests
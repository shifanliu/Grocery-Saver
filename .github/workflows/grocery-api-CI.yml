name: CI - Grocery API

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/grocery_api 

    env:
      DATABASE_URL: sqlite:///./grocery.db
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      REPO_TYPE: db



    steps:
      # Step 1: Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Setup Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      # Step 3: Upgrade pip and install uv
      - name: Install uv
        run: python -m pip install --upgrade pip uv

      # Step 4: Sync dependencies (including dev extras)
      - name: Sync dependencies
        run: uv sync --extra dev

      # Step 5: Run linting
      - name: Lint
        run: make lint

      # Step 6: Run tests with coverage check
      - name: Test with coverage
        run: make test

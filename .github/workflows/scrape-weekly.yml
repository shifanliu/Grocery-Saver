name: Weekly grocery data scrape

on:
  schedule:
    # Every Monday at 13:00 UTC
    - cron: "0 13 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    env:
      # No DATABASE_URL set: app/database.py resolves its own default to
      # <repo_root>/data/grocery.db regardless of the job's working directory.
      REPO_TYPE: db

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Sync dependencies
        working-directory: apps/grocery_api
        run: uv sync

      - name: Run weekly scrape
        working-directory: apps/grocery_api
        run: uv run python ../grocery_collector/upload_to_db.py

      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(data): weekly Costco/Safeway scrape"
          file_pattern: "data/grocery.db"

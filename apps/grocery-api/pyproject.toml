[project]
name = "grocery-api"
version = "0.1.0"
description = "Grocery API for the Grocery-Saver project"
requires-python = ">=3.10"
authors = [
  { name = "Grocery Saver Maintainer", email = "shifanliu@gmail.com" }
]
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  
  "psycopg2-binary>=2.9",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "flake8>=6.0",
  "black>=24.0",
  "isort>=6.0",
  "pylint>=3.0",
  "pytest-cov>=4.0",      # for coverage
  "httpx>=0.26" 
]

[dependency-groups]
dev = [
    "autoflake>=2.3.1",
]

[tool.black]
line-length = 79

[tool.pylint."MESSAGES CONTROL"]
disable = [
    "import-error",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-positional-arguments",
    "too-many-instance-attributes",
    "duplicate-code",
]

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: grocery
      POSTGRES_PASSWORD: grocery
      POSTGRES_DB: grocery
    ports: ["5432:5432"]
    volumes:
      - dbdata:/var/lib/postgresql/data
  api:
    build: ../apps/grocery-api
    env_file: ../.env
    depends_on: [ db ]
    ports: ["8000:8000"]
  adminer:
    image: adminer
    ports: ["8080:8080"]
volumes:
  dbdata:
